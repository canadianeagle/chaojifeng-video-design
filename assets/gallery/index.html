$('scenario').innerHTML+='<option value="" disabled>────────</option>'+catalog.scenario.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
$('preview-style').innerHTML=catalog.style.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
function renderList(){const term=$('search').value.trim().toLowerCase(),kind=$('kind').value,sc=catalog.scenario.find(x=>x.id===$('scenario').value);const filtered=records.filter(x=>(kind==='all'||x.kind===kind)&&(!term||JSON.stringify(x).toLowerCase().includes(term))&&(!sc||(x.kind==='scenario'?x.id===sc.id:(sc[x.kind+'_ids']||[]).includes(x.id))));$('count').textContent=`显示 ${filtered.length} / ${records.length} 项`;$('items').innerHTML=filtered.length?filtered.map(x=>`<button class="item" type="button" data-kind="${x.kind}" data-id="${esc(x.id)}" aria-pressed="${x.kind===selected.kind&&x.id===selected.id}"><strong>${esc(x.name)}</strong><small>${kinds[x.kind]} · ${esc(x.id)}</small></button>`).join(''):'<p class="empty">没有匹配项。可以清空关键词或选择其他场景。</p>';$('items').querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>select(records.find(x=>x.id===el.dataset.id&&x.kind===el.dataset.kind))));}
function asList(value){if(Array.isArray(value))return '<ul>'+value.map(x=>'<li>'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')+'</ul>';if(value&&typeof value==='object')return '<pre>'+esc(JSON.stringify(value,null,2))+'</pre>';return '<p>'+esc(value||'见完整合同')+'</p>';}
function style(){const s=catalog.style.find(x=>x.id===$('preview-style').value)||catalog.style[0],t=s.tokens,stage=$('stage');stage.style.setProperty('--bg',t.background);stage.style.setProperty('--fg',t.foreground);stage.style.setProperty('--ac',t.accent);stage.style.setProperty('--radius',(t.radius?.value??12)+'px');stage.style.fontFamily=Array.isArray(t.font_stack)?t.font_stack.join(','):t.font_stack;renderAt(elapsed);}
function select(x){selected=x;motion=x.kind==='motion'?x.id:'hold';if(x.kind==='style')$('preview-style').value=x.id;$('title').textContent=x.name;$('identifier').textContent=kinds[x.kind]+' / '+x.id;$('intent').textContent=x.intent;$('inputs').innerHTML=asList(x.required_inputs||x.inputs||x.applicable_inputs);$('constraints').innerHTML=asList(x.constraints);$('fallback').innerHTML=asList(x.fallback);$('contract').textContent=JSON.stringify(x,null,2);$('tags').innerHTML=(x.channels||x.layouts||x.motion_character||[]).slice?.(0,6)?.map?.(v=>`<span class="badge">${esc(typeof v==='string'?v:JSON.stringify(v))}</span>`).join('')||'';$('verification').textContent='目录状态：设计 '+(x.verification?.design?.status||'未知')+' / 预览 '+(x.verification?.preview?.status||'not_run')+' / 导出 '+(x.verification?.exported?.status||'not_run')+'。此处无音频；指导项未实现或验证。示意不改变目录状态。';$('stage-title').textContent=x.kind==='motion'?x.name+' · 主体与关系':x.kind==='style'?x.name+' · 风格示意':'内容主体 → 变化结果';$('stage-note').textContent=['expression','recipe'].includes(x.kind)?'指导合同 · 当前画面仅为占位示意，未实现该表达或配方':'原创无声示意 · 4 秒循环 · 可拖动时间';$('copy-state').textContent='';elapsed=0;style();renderList();}
const clamp=(x,l=0,r=1)=>Math.max(l,Math.min(r,x)),ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
function renderAt(ms){const t=ms/1000,p=ease((t-.35)/1.35);a.style.cssText='';b.style.cssText='';scene.style.transform='';grid.style.transform='';path.style.strokeDashoffset='0';path.style.opacity='1';number.style.display='none';a.textContent='内容主体';b.textContent='变化结果';chips.forEach(x=>x.style.cssText='');
 switch(motion){
 case 'reveal':a.style.opacity=p;a.style.transform=`translateY(${(1-p)*24}px)`;break;
 case 'exit':{const q=ease((t-1)/1);a.style.opacity=1-q;a.style.transform=`translateY(${-q*22}px)`;break;}
 case 'highlight':a.style.color=t>.7?'var(--ac)':'var(--fg)';a.style.opacity=.55+.45*p;break;
 case 'trace':path.style.strokeDashoffset=200*(1-p);break;
 case 'connect':path.style.strokeDashoffset=200*(1-p);path.style.opacity=p;break;
 case 'count':a.style.opacity='0';number.style.display='block';number.textContent=Math.round(100*p);break;
 case 'state-swap':a.textContent=t<1.25?'原始状态':'更新状态';a.style.opacity=t<1.25?1-clamp((t-1)/.25):clamp((t-1.25)/.3);break;
 case 'camera-focus':scene.style.transform=`translate(${-p*11}%,${p*3}%) scale(${1+p*.23})`;break;
 case 'mask-wipe':a.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;break;
 case 'stagger':chips.forEach((x,i)=>{const q=ease((t-.3-i*.35)/.6);x.style.opacity=q;x.style.transform=`translateY(${(1-q)*12}px)`;});break;
 case 'parallax':grid.style.transform=`translateX(${-p*28}px)`;a.style.transform=`translateX(${p*20}px)`;b.style.transform=`translateX(${-p*12}px)`;break;
 case 'hold':if(selected.kind==='motion'){a.textContent='保持可读';b.textContent='等待理解';}break;
 }
 $('seek').value=Math.round(ms);$('time').textContent=(ms/1000).toFixed(2)+' / 4.00秒';
}
function pause(){playing=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;$('play').textContent='播放示意';$('play').setAttribute('aria-pressed','false');}
function tick(now){if(!playing)return;if(last)elapsed=(elapsed+now-last)%4000;last=now;renderAt(elapsed);frame=requestAnimationFrame(tick);}
$('play').addEventListener('click',()=>{if(playing)pause();else{playing=true;last=0;$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');frame=requestAnimationFrame(tick);}});
$('seek').addEventListener('input',()=>{pause();elapsed=Number($('seek').value);renderAt(elapsed)});
['search','kind','scenario'].forEach(id=>$(id).addEventListener('input',renderList));$('preview-style').addEventListener('input',style);
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(selected.id);$('copy-state').textContent='已复制 '+selected.id;}catch{$('copy-state').textContent='请复制上方ID：'+selected.id;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});select(selected);
</script></body></html>
